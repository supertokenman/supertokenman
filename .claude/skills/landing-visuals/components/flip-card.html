<!-- Flip card: a real button. Front = name + dot drawing, back = one sentence of existing copy.
     Needs visuals.css + visuals.js. Spec chars: # ink, * accent, + accent that fills (meter), . faint -->
<button class="flip" type="button" aria-pressed="false"><span class="inner">
  <span class="face front"><span class="hint">Approvals</span><b>ask first.</b>
    <span class="dots" aria-hidden="true" data-dots="#############/#...........#/#.###..****.#/#############"></span></span>
  <span class="face back"><span class="hint">Approvals</span><p>Tool calls wait for your approval, unless you let a persona run the safe ones alone.</p></span>
</span></button>
