<!-- Floating layered app screenshots that tilt with the pointer (fine pointers only, off with reduced motion).
     The zone that listens is the nearest [data-tilt-zone]; data-tilt is the max angle in degrees.
     Images: real app screens only (site/assets/*.jpg, or app/scripts/shots.mjs). aria-hidden: decoration. -->
<section data-tilt-zone>
  <div class="scene" aria-hidden="true">
    <div class="stack" data-tilt="14">
      <figure class="l1"><img src="assets/search.jpg" alt="" width="1280" height="800"></figure>
      <figure class="l2"><img src="assets/content.jpg" alt="" width="1280" height="800"></figure>
      <figure class="l3"><img src="assets/panels.jpg" alt="" width="1280" height="800"></figure>
      <span class="tag">COST PER TURN</span>
    </div>
  </div>
</section>
