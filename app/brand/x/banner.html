<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'SuperToken Display'; src: url('file:///home/user/CLI/app/src/fonts/supertoken-display.woff2') format('woff2'); }
* { margin:0; box-sizing:border-box }
body { width:1500px; height:500px; overflow:hidden; background:#141413; position:relative; font-family: Inter, -apple-system, system-ui, sans-serif; }
.grid { position:absolute; inset:0; background-image: linear-gradient(#1f1e1b 1px, transparent 1px), linear-gradient(90deg, #1f1e1b 1px, transparent 1px); background-size: 50px 50px; opacity:.9 }
.disc { position:absolute; width:560px; height:560px; border-radius:50%; background:#d97757; right:-140px; top:-260px; opacity:.16 }
.band { position:absolute; width:1100px; height:150px; background:#1f1e1b; right:-160px; bottom:40px; transform: rotate(-14deg); }
.band2 { position:absolute; width:560px; height:16px; background:#d97757; right:-40px; bottom:70px; transform: rotate(-14deg); }
.sq { position:absolute; width:110px; height:110px; border:5px solid #9fc48a; opacity:.55; transform: rotate(18deg); left:70px; top:70px; width:80px; height:80px; }
.tile { position:absolute; width:58px; height:58px; background:#d97757; clip-path: polygon(0 0,100% 0,100% 70%,70% 100%,0 100%); }
.hero { position:absolute; right:70px; bottom:60px; width:300px; height:300px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.55)); }
.copy { position:absolute; left:330px; top:70px; width:600px; }
.kicker { font-family:'SuperToken Display'; color:#9fc48a; letter-spacing:6px; font-size:20px; }
.name { font-family:'SuperToken Display'; color:#f4efe6; font-size:78px; line-height:1; margin-top:14px; }
.name b { color:#d97757; font-weight:inherit }
.tag { color:#b0aea5; font-size:26px; line-height:1.35; margin-top:18px; }
.tag strong { color:#f4efe6; font-weight:600 }
</style></head><body>
<div class="grid"></div><div class="disc"></div><div class="band"></div><div class="band2"></div><div class="sq"></div>
<div class="tile" style="left:250px;top:76px"></div>
<div class="copy">
  <div class="kicker">FOR DEVELOPERS · ON YOUR MAC</div>
  <div class="name">SUPER<b>TOKEN</b>MAN</div>
  <div class="tag"><strong>Your whole dev day in one window.</strong><br>Claude panels, personas, costs, CI and cloud.</div>
</div>
<svg class="hero" viewBox="184 190 656 656"><g transform="translate(184 200) scale(10.25)" shape-rendering="crispEdges">
  
  <!-- original pixel mascot: SuperTokenMan, a token hero with a cape and a T emblem, in Claude colors; it bobs and its cape waves -->
  <g>
    
    <!-- cape (behind the body), waving -->
    <path d="M17 20 H47 L58 58 L48 54 L40 60 L32 55 L24 60 L16 54 L6 58 Z" fill="#141413" stroke="#e8e6dc" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- body and head: one rounded token shape -->
    <rect x="18" y="10" width="28" height="38" rx="8" fill="#d97757"/>
    <!-- hair with a forelock curl -->
    <rect x="18" y="10" width="28" height="5" rx="3" fill="#141413"/>
    <rect x="29" y="15" width="3" height="2" fill="#141413"/>
    <rect x="31" y="17" width="2" height="2" fill="#141413"/>
    <!-- eyes, blinking -->
    <rect x="24" y="19" width="5" height="6" fill="#faf9f5"/>
    <rect x="35" y="19" width="5" height="6" fill="#faf9f5"/>
    <rect x="26" y="21" width="2" height="3" fill="#141413">
      
    </rect>
    <rect x="37" y="21" width="2" height="3" fill="#141413">
      
    </rect>
    <!-- emblem: hexagon badge with a T -->
    <path d="M32 28 L40 32 L40 39 L32 43 L24 39 L24 32 Z" fill="#faf9f5" stroke="#141413" stroke-width="1.5"/>
    <path d="M27.5 32 H36.5 V34.5 H33.3 V40 H30.7 V34.5 H27.5 Z" fill="#c15f3c"/>
    <!-- belt, arms and boots -->
    <rect x="18" y="44" width="28" height="3" fill="#141413"/>
    <rect x="13" y="28" width="5" height="11" rx="2" fill="#d97757"/>
    <rect x="46" y="28" width="5" height="11" rx="2" fill="#d97757"/>
    <rect x="22" y="48" width="7" height="6" fill="#141413"/>
    <rect x="35" y="48" width="7" height="6" fill="#141413"/>
  </g>
</g></svg>
</body></html>
