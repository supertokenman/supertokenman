<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: stmmedia:; media-src 'self' stmmedia: blob:; frame-src 'self' stmapp:; connect-src 'self' https://api.frankfurter.dev ws://localhost:5173 wss: ws://localhost:8799" />
    <title>SuperTokenMan</title>
    <style>
      /* Before any script: the window's own dark (#0f0f0e, electron/main.ts backgroundColor), so the launch
         goes straight into the dark opening (Splash.tsx) with no flash. The closing is the same dark coming
         back over the app with the mark and name (boot.ts). */
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #0f0f0e; color: #ecebe6; pointer-events: none; font-family: -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      #boot .boot-name { font-size: clamp(28px, 3.6vw, 48px); font-weight: 600; letter-spacing: -0.03em; opacity: 0; }
      #boot > div { display: grid; justify-items: center; gap: 22px; }
      #boot .boot-mark { fill: #ecebe6; opacity: 0; }
      #boot .boot-mark .acc { fill: #d97757; }
      #boot.out { transition: opacity 240ms ease; opacity: 0; }
      #boot.bye { opacity: 0; animation: boot-bye 320ms cubic-bezier(.4,0,.2,1) forwards; }
      #boot.bye .boot-name { animation: boot-name 300ms cubic-bezier(.2,.7,.2,1) 80ms forwards; }
      #boot.bye .boot-mark { animation: boot-mark 280ms cubic-bezier(.2,.7,.2,1) 60ms forwards; }
      @keyframes boot-bye { to { opacity: 1; } }
      @keyframes boot-name { from { filter: blur(6px); } to { opacity: 1; filter: blur(0); } }
      @keyframes boot-mark { from { transform: scale(.96); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #boot, #boot * { animation-duration: 1ms !important; animation-delay: 0s !important; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
