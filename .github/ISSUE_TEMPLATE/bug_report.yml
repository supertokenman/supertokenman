name: Bug report
description: Something in the app does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SuperTokenMan version
      description: About SuperTokenMan, or the release you downloaded.
      placeholder: 0.1.11
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, Apple silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a panel in ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        From ~/Library/Application Support/SuperTokenMan/logs. Remove anything private (paths, project
        names, keys) before pasting.
      render: text
