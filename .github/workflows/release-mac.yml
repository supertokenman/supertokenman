# Signed and notarized macOS build, started by hand from main. The signing secrets live in the "release"
# environment, which needs a person's approval before each run reads them; pull requests and forks never
# get them. With "publish" on, the build goes to a DRAFT release of this repository (tag v<version from
# app/package.json>) with SHA256SUMS and a GitHub build attestation that ties each file to this commit;
# nothing is public until the draft is published by hand. Actions are pinned to commits.
name: release-mac
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to a draft release of this repository
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  mac:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # no dependency cache: a cache written by another run could be swapped in before signing
      - run: npm ci
      # npm ci on this Apple silicon runner installs only the arm64 Claude binary; the Intel build
      # needs the darwin-x64 one too, at the same version as the SDK. --force skips the cpu check.
      - name: Claude binary for Intel
        run: npm install --no-save --force "@anthropic-ai/claude-agent-sdk-darwin-x64@$(node -p "require('@anthropic-ai/claude-agent-sdk/package.json').version")"
      - run: npm test
      - name: App Store Connect key to a file
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
      # our own keychain for the Developer ID: electron-builder's temporary one failed to unlock on the
      # macOS runner. It lives in RUNNER_TEMP, is unlocked for this run only and deleted at the end.
      - name: Keychain with the Developer ID
        env:
          P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(openssl rand -hex 24)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Apple's Developer ID intermediate, so the identity reads as valid even on a runner without it
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q "Developer ID Application" || { echo "No Developer ID Application identity in the keychain" >&2; exit 1; }
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        env:
          # the identity is found in the keychain above; no CSC_LINK, so electron-builder makes none of its own
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist:mac:signed
      - name: Verify
        run: |
          for app in release/mac*/SuperTokenMan.app; do bash scripts/verify-mac.sh "$app"; done
      - name: Checksums
        run: |
          cd release
          ls *.dmg *.zip latest-mac.yml
          shasum -a 256 *.dmg *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Attestation
        if: inputs.publish
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            app/release/*.dmg
            app/release/*.zip
      - name: Draft release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo "$REPO" >/dev/null 2>&1; then
            echo "$v already exists in $REPO; bump the version in app/package.json." >&2
            exit 1
          fi
          gh release create "$v" --repo "$REPO" --draft --title "SuperTokenMan $v" \
            --notes-file ../docs/release-notes.md \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release/SHA256SUMS
      - name: Remove the key file and the keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/cert.p12"
          [ -n "$SIGNING_KEYCHAIN" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supertokenman-mac
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/latest-mac.yml
            app/release/SHA256SUMS
          retention-days: 7
