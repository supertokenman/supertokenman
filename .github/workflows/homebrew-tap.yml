# When a release is published, regenerate the Homebrew cask from that release's SHA256SUMS and push it to
# supertokenman/homebrew-tap. The push uses HOMEBREW_TAP_TOKEN, a fine-grained token with contents:write
# on that repository only; this repository's own token stays read-only. Without the secret the job says
# so and ends green. Setup: docs/RELEASE.md, "Homebrew tap". Actions are pinned to commits.
name: homebrew-tap
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Token present?
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap update (see docs/RELEASE.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cask from SHA256SUMS
        if: steps.token.outputs.ok == 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/SHA256SUMS" "https://github.com/$REPO/releases/download/$TAG/SHA256SUMS"
          bash packaging/homebrew/gen-cask.sh "${TAG#v}" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/supertokenman.rb"
          ruby -c "$RUNNER_TEMP/supertokenman.rb"
      - name: Push to the tap
        if: steps.token.outputs.ok == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tap="$RUNNER_TEMP/tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/supertokenman/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Casks"
          cp "$RUNNER_TEMP/supertokenman.rb" "$tap/Casks/supertokenman.rb"
          cd "$tap"
          git add Casks/supertokenman.rb
          if git diff --cached --quiet; then echo "Cask already at $TAG."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "supertokenman ${TAG#v}"
          git push origin HEAD
